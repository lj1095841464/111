<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PII 脱敏工具</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #333; }
        textarea { width: 100%; height: 120px; margin: 10px 0; padding: 10px; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { background: #f8f9fa; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        .section { margin-top: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>📝 文本脱敏</h2>
    <textarea id="textInput" placeholder="请输入要脱敏的文本..."></textarea><br>
    <button onclick="desensitizeText()">脱敏</button>
    <div id="textResult" class="result"></div>

    <!-- 文件脱敏区域 -->
    <div class="section">
        <h2>📁 文件脱敏（上传即下载）</h2>
        <p>支持格式：.txt / .docx / .xlsx</p>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="file" accept=".txt,.docx,.xlsx" required>
            <button type="submit">上传并脱敏</button>
        </form>
        <div id="fileStatus" style="margin-top: 10px; color: #d63031;"></div>
    </div>

    <script>
        // 文本脱敏
        async function desensitizeText() {
            const text = document.getElementById('textInput').value;
            const res = await fetch('/desensitize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();
            document.getElementById('textResult').textContent = data.desensitized;
        }

        // 文件脱敏（直接下载）
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const statusDiv = document.getElementById('fileStatus');
            statusDiv.textContent = "处理中...";

            try {
                const response = await fetch('/desensitize-file', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    statusDiv.textContent = "❌ " + errorText;
                    return;
                }

                // 触发下载
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                let filename = '脱敏文件';
                const contentDisposition = response.headers.get('content-disposition');
                if (contentDisposition) {
                    const match = contentDisposition.match(/filename\*=UTF-8''(.+)/);
                    if (match) filename = decodeURIComponent(match[1]);
                }

                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();

                statusDiv.textContent = "✅ 下载完成！";
            } catch (err) {
                statusDiv.textContent = "❌ 网络错误: " + err.message;
            }
        });
    </script>
</body>
</html>
